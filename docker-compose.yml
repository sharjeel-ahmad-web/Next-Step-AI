services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: nextstep_mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=my_laravel
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - nextstep_network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # Laravel Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextstep_backend
    restart: unless-stopped
    working_dir: /app
    environment:
      - APP_NAME=NextStep
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mongodb
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_DATABASE=my_laravel
      - SESSION_DRIVER=file
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - FILESYSTEM_DISK=local
      - MAIL_MAILER=log
      - LOG_CHANNEL=stack
      - LOG_LEVEL=info
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
      - ./php.ini:/usr/local/etc/php/php.ini
    networks:
      - nextstep_network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextstep_frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
      - NODE_ENV=development
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - nextstep_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5173" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  nextstep_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  backend_storage:
    driver: local
  frontend_node_modules:
    driver: local
